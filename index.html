<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кутман & Сезим — 07.07.2027</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #2c2c2c;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .section-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            font-family: serif;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .attendance-options {
            display: flex;
            gap: 15px;
        }
        .radio-label {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .radio-label.selected {
            background-color: #6b5b55;
            color: white;
            border-color: #6b5b55;
        }
        .radio-label input {
            display: none;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #6b5b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #554742;
        }
        #successMsg {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 8px;
            text-align: center;
        }
        .guests-container {
            margin-top: 30px;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .guest-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .guest-item:last-child {
            border-bottom: none;
        }
        .guest-name {
            font-weight: bold;
            color: #444;
        }
        .guest-message {
            font-style: italic;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <body>
    <div class="container">
        
        <!-- Вставляем фото сюда, перед анкетой -->
        <img src="photo_1.jpg" alt="Наше фото" style="width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        
     
        <img src="photo_2.jpg" alt="Наше фото" style="width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">

       
      
        <!-- 7 & 9. RSVP (Придут/Не придут) и Пожелания -->
        <div class="form-section">
            <div class="section-title">Анкета гостя</div>
            
            <form id="weddingForm" action="https://script.google.com/macros/s/AKfycbyeJyilNLLSf3g99-CjFUhDL7SYRac3hPvCSv8ZoLzF6x8UgAcSwUqVp8uZ3r0aDsQ/exec" method="POST">
                <div class="form-group">
                    <label for="guestName">Ваше Имя и Фамилия</label>
                    <input type="text" id="guestName" name="name" class="form-control" placeholder="Например, Бакыт и Айгерим" required>
                </div>

                <div class="form-group">
                    <label>Сможете ли вы присутствовать?</label>
                    <div class="attendance-options">
                        <label class="radio-label selected" id="labelYes">
                            <input type="radio" name="attendance" value="yes" checked> С радостью приду
                        </label>
                        <label class="radio-label" id="labelNo">
                            <input type="radio" name="attendance" value="no"> К сожалению, не смогу
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="guestMessage">Ваши пожелания молодоженам</label>
                    <textarea id="guestMessage" name="message" class="form-control" rows="3" placeholder="Напишите теплые слова..."></textarea>
                </div>

                <button type="submit" class="submit-btn">ОТПРАВИТЬ ОТВЕТ</button>
                
                <div id="successMsg">Спасибо! Ваш ответ успешно отправлен ✨</div>
            </form>
        </div>

        <!-- Блок отображения списка гостей и пожеланий -->
        <div class="guests-container">
            <h3 style="text-align: center; margin-bottom: 15px; font-family: serif; font-size: 20px;">Пожелания гостей</h3>
            <div id="guestsList">Загрузка ответов...</div>
        </div>
    </div>

    <script>
        // --- Интерактив выбора кнопок (приду/не приду) ---
        const radioLabels = document.querySelectorAll('.radio-label');
        radioLabels.forEach(label => {
            label.addEventListener('click', function() {
                radioLabels.forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input').checked = true;
            });
        });

        // --- URL вашего Google Web App ---
        var scriptUrl = "https://script.google.com/macros/s/AKfycbyeJyilNLLSf3g99-CjFUhDL7SYRac3hPvCSv8ZoLzF6x8UgAcSwUqVp8uZ3r0aDsQ/exec";

        // --- Обработка отправки формы ---
        document.getElementById("weddingForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            var form = this;
            var data = {
                name: document.getElementById("guestName").value,
                attendance: document.querySelector('input[name="attendance"]:checked').value,
                message: document.getElementById("guestMessage").value
            };

            fetch(scriptUrl, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById("successMsg").style.display = "block";
                form.reset();
                // Сбрасываем визуальный выбор радиокнопок по умолчанию
                document.getElementById('labelYes').click();
                setTimeout(() => {
                    document.getElementById("successMsg").style.display = "none";
                }, 5000);
                // Обновляем список на сайте через 1.5 секунды
                setTimeout(loadGuests, 1500);
            }).catch(error => console.error('Ошибка!', error));
        });

        // --- Загрузка списка гостей и пожеланий ---
        function loadGuests() {
            fetch(scriptUrl)
                .then(response => response.json())
                .then(data => {
                    var container = document.getElementById("guestsList");
                    if (!data || data.length === 0) {
                        container.innerHTML = "<p style='text-align:center; color:#888;'>Пока нет ответов. Будьте первыми!</p>";
                        return;
                    }
                    
                    var html = "";
                    // Переворачиваем массив, чтобы новые ответы были сверху
                    data.slice().reverse().forEach(guest => {
                        var statusText = guest.attendance === "yes" ? "✨ Придет" : "❌ Не сможет";
                        var statusColor = guest.attendance === "yes" ? "#2d6a4f" : "#bc6c25";
                        html += `<div class="guest-item">
                            <div class="guest-name">${guest.name} <span style="font-size: 13px; color: ${statusColor}; font-weight: normal; float: right;">${statusText}</span></div><div class="guest-message">«${guest.message || 'Без пожелания'}»</div>
                        </div>`;
                    });
                    container.innerHTML = html;
                })
                .catch(err => {
                    document.getElementById("guestsList").innerHTML = "<p style='text-align:center; color:#888;'>Список скоро появится.</p>";
                });
        }

        // Загружаем список при открытии страницы
        loadGuests();
    </script>
</body>
</html>
